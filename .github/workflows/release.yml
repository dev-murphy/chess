name: Create Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  version:
    name: Bump Version
    runs-on: ubuntu-latest

    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}

    # Avoid double commiting release commit
    if: "!startsWith(github.event.head_commit.message, 'bump:')"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Python project
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Commitizen
        uses: commitizen-tools/setup-cz@main

      - name: Bump version and generate changelog
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"

          old_sha=$(git rev-parse HEAD)
          cz --no-raise 21 bump --yes

          if [ "$(git rev-parse HEAD)" == "$old_sha" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=$(cz version -p)
          TAG=$(cz version -p --tag)

          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Push version and tags
        if: steps.bump.outputs.bumped == 'true'
        run: git push origin HEAD:main --follow-tags

  build:
    name: Build Executables
    needs: version
    if: needs.version.outputs.bumped == 'true'
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.version.outputs.tag }}

  release:
    name: Create GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Download executables
        uses: actions/download-artifact@v7
        with:
          pattern: executable-*
          path: release-assets
          merge-multiple: true

      - name: Create release with executables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v v="${{ needs.version.outputs.version }}" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found=1; next } }
            found
          ' CHANGELOG.md > release-notes.md

          ls -l release-assets
          gh release create "${{ needs.version.outputs.tag }}" \
            --title "${{ needs.version.outputs.tag }}" \
            --notes-file release-notes.md \
            release-assets/*

