name: Create Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Version and Release
    runs-on: ubuntu-latest

    # Avoid double commiting release commit
    if: "!startsWith(github.event.head_commit.message, 'bump:')"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Python project
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Commitizen
        uses: commitizen-tools/setup-cz@main

      - name: Bump version and generate changelog
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"

          old_sha=$(git rev-parse HEAD)
          cz --no-raise 21 bump --yes

          if [ "$(git rev-parse HEAD)" == "$old_sha" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=$(cz version -p)
          TAG=$(cz version -p --tag)

          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Push version and tags
        if: steps.bump.outputs.bumped == 'true'
        run: git push origin HEAD:main --follow-tags

      - name: Create Github Release
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cz changelog "${{ steps.bump.outputs.version }}" --dry-run > release-notes.md
          gh release create "${{ steps.bump.outputs.tag }}" \
            --title "${{ steps.bump.outputs.tag }}" \
            --notes-file release-notes.md
